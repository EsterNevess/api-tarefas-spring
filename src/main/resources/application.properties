spring.application.name=api-tarefas

# Banco: por padrão o PostgreSQL do docker-compose; tudo pode ser trocado por variável de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarefas}
spring.datasource.username=${DB_USUARIO:tarefas}
spring.datasource.password=${DB_SENHA:tarefas}

# O esquema é criado pelo Flyway; o Hibernate só confere se a entidade bate com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Senha dos usuários de demonstração (admin, supervisor, ana, bruno). Só para demonstração.
app.senha-demo=${SENHA_DEMO:senha123}
