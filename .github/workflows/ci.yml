# Integração contínua: a cada push, pull request ou clique em "Run workflow".
#  1. java    - testes unitários e de integração + cobertura mínima (JaCoCo)
#  2. api     - sobe a API com PostgreSQL via Docker Compose e roda pytest e k6 contra ela
#  3. relatorio - publica o relatório Allure e a cobertura no GitHub Pages
name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java:
    name: Testes Java e cobertura
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes e verificar cobertura mínima
        run: ./mvnw -B verify

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Guardar relatórios do JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/surefire-reports/
          if-no-files-found: ignore

  api:
    name: Testes de API (Docker + PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir a API e o banco
        run: docker compose up -d --build

      - name: Esperar a API ficar de pé
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar após ${i} tentativas"; exit 0
            fi
            sleep 2
          done
          echo "A API não subiu a tempo"; docker compose logs api; exit 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes de API (pytest)
        id: pytest
        continue-on-error: true
        working-directory: testes-api
        env:
          API_URL: http://localhost:8080
        run: |
          pip install -r requirements.txt
          python -m pytest --alluredir=../allure-results

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar teste de desempenho (k6 smoke)
        id: k6
        continue-on-error: true
        run: k6 run k6/smoke.js

      - name: Logs da API
        if: always()
        run: docker compose logs api | tail -n 80

      - name: Guardar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api
          path: allure-results/
          if-no-files-found: ignore

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v

      - name: Refletir o resultado dos testes
        if: steps.pytest.outcome == 'failure' || steps.k6.outcome == 'failure'
        run: exit 1

  relatorio:
    name: Relatório Allure e cobertura
    needs: [java, api]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar os resultados da API
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-api
          path: allure-results

      - name: Baixar a cobertura
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cobertura
          path: cobertura

      - name: Recuperar o histórico
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Preservar o histórico
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/
            echo "Histórico recuperado"
          else
            echo "Sem histórico anterior (primeira execução)"
          fi

      - name: Preparar Java (o Allure roda sobre a JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Allure
        run: npm install -g allure-commandline --silent

      - name: Gerar o relatório
        run: |
          allure generate allure-results --clean -o allure-report
          if [ -d cobertura ]; then cp -r cobertura allure-report/cobertura; fi

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
