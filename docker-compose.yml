services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarefas -d tarefas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://banco:5432/tarefas
      DB_USUARIO: tarefas
      DB_SENHA: tarefas
    ports:
      - "8080:8080"
